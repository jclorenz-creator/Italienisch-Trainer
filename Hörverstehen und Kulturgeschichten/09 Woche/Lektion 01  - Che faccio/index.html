<!doctype html><html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>09 Woche – Che faccio? Lascio?</title><style>:root{color-scheme:light;--ink:#182126;--muted:#657178;--line:#e5e9ed;--paper:#f4f5f8;--green:#176b56;--blue:#e7f0ff;--red:#fff0f0;--mint:#edf8f2;--grey:#f1f2f4;--yellow:#fff6d8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1440px;margin:0 auto;padding:28px 22px 50px}header{margin-bottom:20px}h1{font-size:clamp(1.7rem,3vw,2.25rem);line-height:1.15;margin:16px 0 2px}header p{color:var(--muted);margin:0}.pdf{color:var(--green);font-size:.92rem;font-weight:600}.notice{background:var(--yellow);border-radius:12px;padding:13px 16px;margin:20px 0 16px}.all-delete{appearance:none;border:0;border-radius:10px;background:#eceef1;padding:11px 16px;font:600 .95rem system-ui;color:#252a30;cursor:pointer;margin:0 0 10px}.all-delete:hover{background:#e1e4e8}.card{display:grid;grid-template-columns:54px minmax(250px,1fr) auto;align-items:center;gap:12px 16px;background:#fff;border:1px solid var(--line);border-radius:17px;padding:13px 16px;margin:11px 0;box-shadow:0 2px 8px #00000009}.num{font-size:1rem;font-weight:750;color:#686f77;text-align:center}.text{min-width:0}.it{font-size:1.12rem;font-weight:700;line-height:1.28;margin:0 0 3px}.de{font-size:1rem;color:#69717a;margin:0}.actions{display:flex;gap:10px;align-items:center}.actions button{appearance:none;border:0;border-radius:13px;padding:13px 16px;font:600 .93rem system-ui;white-space:nowrap;cursor:pointer;color:#20242a}.listen{background:var(--blue)}.record{background:var(--red)}.mine{background:var(--mint)}.delete{background:var(--grey)}.actions button:hover:not(:disabled){filter:brightness(.97)}.actions button:disabled{opacity:.5;cursor:not-allowed}.actions .recording{background:#b42318;color:white}.status{grid-column:2/-1;min-height:0;font-size:.82rem;color:var(--muted)}.status:empty{display:none}.note{color:var(--muted);font-size:.88rem;margin:18px 0 0}.section-heading{grid-column:1/-1;font-size:1.35rem;color:#263d35;margin:28px 0 6px;padding-top:12px;border-top:1px solid #d8dee5}.audio-block{background:white;border:1px solid var(--line);border-radius:17px;padding:16px;margin:12px 0}.audio-block h3{margin:0 0 10px;font-size:1rem}.audio-block audio{max-width:100%}@media(max-width:1050px){.card{grid-template-columns:42px minmax(220px,1fr)}.actions{grid-column:2;flex-wrap:wrap}.status{grid-column:2}.actions button{padding:10px 13px}}@media(max-width:560px){main{padding:20px 12px 36px}.card{grid-template-columns:34px minmax(0,1fr);gap:8px;padding:12px}.it{font-size:1rem}.de{font-size:.92rem}.actions{gap:6px}.actions button{font-size:.83rem;padding:9px 10px}}</style></head><body><main><header><h1>09 Woche 🇮🇹 Che faccio? Lascio?</h1><p>Italienisch-Lerndatei · 57 Sätze und 18 Wörter</p><a class="pdf" href="Che%20faccio.pdf" target="_blank" rel="noopener">PDF öffnen</a></header><div class="notice">Beim ersten Klick auf „Aufnehmen“ bitte den Mikrofonzugriff erlauben.</div><button class="all-delete" id="deleteAll" type="button">🗑 Alle Aufnahmen löschen</button><section id="lesson" aria-label="Italienische Sätze mit Übersetzung und Wortschatz"></section><p class="note">Deine Aufnahmen werden nur in diesem Browser gespeichert und bleiben von anderen Lektionen getrennt.</p></main><script>'use strict';const lesson={"items":[["Che faccio? Lascio?","Was soll ich machen? Darf es etwas mehr sein?"],["Come ogni sabato mattina, Luca è andato al supermercato per fare la spesa settimanale.","Wie jeden Samstagmorgen ging Luca in den Supermarkt, um den Wocheneinkauf zu erledigen."],["Come al solito, il banco dei salumi era per lui una grande sfida.","Wie immer war die Wurst- und Schinkentheke für ihn eine grosse Herausforderung."],["Prosciutto, salame, mortadella, coppa, capocollo, bresaola…","Schinken, Salami, Mortadella, Coppa, Capocollo, Bresaola …"],["Ogni volta che ci andava, non riusciva a resistere e finiva per comprare troppi salumi!","Jedes Mal, wenn er dorthin ging, konnte er nicht widerstehen und kaufte am Ende zu viele Wurst- und Schinkenwaren!"],["Oggi però aveva deciso di fare sul serio: “Solo il necessario, niente di più”, si ripeteva.","Heute hatte er jedoch beschlossen, ernst zu machen: «Nur das Nötigste, nicht mehr», sagte er sich immer wieder."],["Si è avvicinato al banco dei salumi con determinazione e ha preso il numero.","Entschlossen ging er zur Wursttheke und zog eine Nummer."],["C’era un po’ di coda.","Es gab eine kleine Warteschlange."],["“Solo il necessario”, si ripeteva Luca mentre aspettava il suo turno.","«Nur das Nötigste», sagte sich Luca immer wieder, während er wartete, bis er an der Reihe war."],["“Numero 32”, ha annunciato il commesso del supermercato.","«Nummer 32», rief der Verkäufer des Supermarkts auf."],["Era un uomo di mezza età con un sorriso gentile.","Er war ein Mann mittleren Alters mit einem freundlichen Lächeln."],["“Buongiorno!”","«Guten Tag!»"],["“Prego, cosa desidera?”, ha chiesto il commesso, pronto a servirlo.","«Bitte, was darf es sein?», fragte der Verkäufer, bereit, ihn zu bedienen."],["“Salve, vorrei un po’ di prosciutto cotto, 150 grammi”, ha risposto Luca, cercando di non guardare troppo il banco con tutti quei diversi tipi di prosciutto e salame.","«Guten Tag, ich hätte gerne etwas Kochschinken, 150 Gramm», antwortete Luca und versuchte, nicht zu sehr auf die Theke mit all den verschiedenen Schinken- und Salamisorten zu schauen."],["“Mi scusi, non ho capito.”","«Entschuldigen Sie, ich habe Sie nicht verstanden.»"],["“Un etto e mezzo, ha detto?”","«150 Gramm, haben Sie gesagt?»"],["“Sì, esatto.” “Grazie.”","«Ja, genau.» «Danke.»"],["“Va bene”, ha detto il commesso e ha cominciato a tagliare il prosciutto con l’affettatrice.","«In Ordnung», sagte der Verkäufer und begann, den Schinken mit der Aufschnittmaschine zu schneiden."],["“Ah, mi può fare delle fette sottili, per favore?”","«Ach, könnten Sie mir bitte dünne Scheiben schneiden?»"],["“Certo, non c’è problema.” “Ecco qui.”","«Natürlich, kein Problem.» «Hier, bitte.»"],["“Ah, mi scusi, sono due etti.”","«Ach, entschuldigen Sie, es sind 200 Gramm geworden.»"],["“Che faccio?” “Lascio?”","«Was soll ich machen?» «Darf ich es so lassen?»"],["“Lasci, lasci, va bene lo stesso.”","«Lassen Sie es ruhig, das ist schon in Ordnung.»"],["“Qualche grammo in più di prosciutto non fa mai male…”","«Ein paar Gramm Schinken mehr können nie schaden …»"],["“Senta, ma l’ha visto il salame in offerta?”","«Sagen Sie, haben Sie die Salami im Sonderangebot gesehen?»"],["“Ma veramente vorrei solo… ma è buono?”","«Eigentlich wollte ich ja nur … aber ist sie gut?»"],["“Il migliore!”","«Die beste!»"],["“Guardi che l’offerta termina oggi, quindi le conviene approfittare.”","«Bedenken Sie, das Angebot gilt nur noch heute. Es lohnt sich also für Sie, zuzugreifen.»"],["“Lo vuole assaggiare?”","«Möchten Sie sie probieren?»"],["Luca era davvero tentato di provare quel salame: aveva lo sconto del venti per cento e sembrava così appetitoso.","Luca war wirklich versucht, diese Salami zu probieren: Sie war um zwanzig Prozent reduziert und sah so appetitlich aus."],["“Mmm, va bene, ma solo per curiosità.”","«Mmm, in Ordnung, aber nur aus Neugier.»"],["“Non lo compro!”, e ne ha assaggiato una fetta.","«Ich kaufe sie nicht!», sagte er und probierte eine Scheibe."],["Mamma mia! Che bontà! Che delizia! E che occasione imperdibile…","Meine Güte! Wie köstlich! Was für ein Genuss! Und was für ein Angebot, das man sich nicht entgehen lassen durfte …"],["“Beh, magari facciamo solo un etto di salame, per non esagerare”, ha detto Luca e il commesso ha cominciato ad affettare.","«Nun ja, nehmen wir vielleicht nur 100 Gramm Salami, damit wir nicht übertreiben», sagte Luca, und der Verkäufer begann, Scheiben abzuschneiden."],["Poi ha messo il salame sulla bilancia per pesarlo.","Dann legte er die Salami auf die Waage, um sie zu wiegen."],["“Mi scusi di nuovo, ma oggi non è giornata.”","«Entschuldigen Sie nochmals, aber heute ist einfach nicht mein Tag.»"],["“È venuto un etto e mezzo di salame.”","«Es sind 150 Gramm Salami geworden.»"],["“Che faccio?” “Lascio?”","«Was soll ich machen?» «Darf ich es so lassen?»"],["“Lasci, lasci pure”, ha risposto Luca, che era sotto sotto felice di tutto quell’affettato.","«Lassen Sie es, lassen Sie es ruhig», antwortete Luca, der sich insgeheim über all den Aufschnitt freute."],["“Altro?” “Un po’ di coppa, bresaola, mortadella…?”","«Sonst noch etwas?» «Etwas Coppa, Bresaola, Mortadella …?»"],["Luca stava per rispondere “basta così!”, quando ha sentito la parola “mortadella”.","Luca wollte gerade «Das ist alles!» antworten, als er das Wort «Mortadella» hörte."],["“La mortadella ha i pistacchi?”","«Ist die Mortadella mit Pistazien?»"],["“C’è con i pistacchi e senza.”","«Es gibt sie mit und ohne Pistazien.»"],["“Magari me ne può tagliare cinque fette?”","«Könnten Sie mir vielleicht fünf Scheiben davon abschneiden?»"],["“Ma certamente”, ha risposto il commesso, che ha cominciato subito a tagliare.","«Aber selbstverständlich», antwortete der Verkäufer und begann sofort zu schneiden."],["“Eh, mi scusi ma oggi sono proprio distratto.” “Sono otto fette.”","«Ach, entschuldigen Sie, heute bin ich wirklich zerstreut.» «Es sind acht Scheiben geworden.»"],["“Che faccio?” “Lascio?”","«Was soll ich machen?» «Darf ich es so lassen?»"],["“Lasci, lasci.”","«Lassen Sie es ruhig.»"],["Insomma… La spesa non stava andando come previsto…","Tja … der Einkauf lief nicht wie geplant …"],["Con il carrello ormai carico di salumi, Luca si è diretto verso la cassa, sentendosi un po’ in colpa per tutto quell’affettato.","Mit dem inzwischen voller Wurst- und Schinkenwaren beladenen Einkaufswagen ging Luca zur Kasse und hatte wegen all des Aufschnitts ein etwas schlechtes Gewissen."],["“Ma sì, domani farò una bella cena con i miei amici con tutti questi salumi”, pensò tra sé.","«Ach was, morgen mache ich mit all diesen Wurst- und Schinkenwaren ein schönes Abendessen mit meinen Freunden», dachte er bei sich."],["“Preparerò dei bei taglieri di affettato e qualche stuzzichino.”","«Ich werde schöne Aufschnittplatten und ein paar Häppchen vorbereiten.»"],["“Congratulazioni!” “Lei è il milionesimo cliente del nostro supermercato!”, gli ha detto il cassiere, felicissimo di dargli questa notizia.","«Herzlichen Glückwunsch!» «Sie sind der millionste Kunde unseres Supermarkts!», sagte der Kassierer zu ihm und freute sich riesig, ihm diese Nachricht zu überbringen."],["Luca era sorpreso. “Milionesimo cliente?” “Ma non ci credo!”","Luca war überrascht. «Der millionste Kunde?» «Das glaube ich ja nicht!»"],["“Sì, è proprio così!”","«Ja, genau so ist es!»"],["“E per ringraziarla di essere nostro cliente, abbiamo un regalo per lei!”","«Und als Dank dafür, dass Sie unser Kunde sind, haben wir ein Geschenk für Sie!»"],["“Lei ha vinto un intero prosciutto crudo in omaggio!” “Congratulazioni ancora!”","«Sie haben einen ganzen Rohschinken als Geschenk gewonnen!» «Nochmals herzlichen Glückwunsch!»"],["il banco dei salumi","die Wursttheke"],["di mezza età","mittleren Alters"],["servire","bedienen"],["la fetta","die Scheibe"],["non fa mai male","schadet nie / kann nie schaden"],["in offerta","im Angebot"],["terminare","enden / zu Ende gehen"],["essere tentati","versucht sein / in Versuchung geraten"],["lo sconto","der Rabatt"],["per curiosità","aus Neugier"],["esagerare","übertreiben"],["affettare","in Scheiben schneiden"],["la bilancia","die Waage"],["pure","ruhig / gerne"],["sotto sotto","insgeheim"],["l’affettato","der Aufschnitt"],["distratto","abgelenkt / zerstreut"],["in omaggio","gratis / als Geschenk"]],"tracks":["Satz 01.mp3","Satz 02.mp3","Satz 03.mp3","Satz 04.mp3","Satz 05.mp3","Satz 06.mp3","Satz 07.mp3","Satz 08.mp3","Satz 09.mp3","Satz 10.mp3","Satz 11.mp3","Satz 12.mp3","Satz 13.mp3","Satz 14.mp3" elete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}function show(card,msg){card.querySelector('.status').textContent=msg}function stopPlayback(){if(currentPlayback){currentPlayback.pause();currentPlayback.currentTime=0;currentPlayback=null}}function addCard(item,index,type,displayIndex){const num=String(displayIndex+1).padStart(2,'0'),id=type+'-'+num,card=document.createElement('article');card.className='card';const n=document.createElement('div');n.className='num';n.textContent=num;const texts=document.createElement('div');texts.className='text';const it=document.createElement('p');it.className='it';it.lang='it';it.textContent=item[0];const de=document.createElement('p');de.className='de';de.lang='de';de.textContent=item[1];texts.append(it,de);const actions=document.createElement('div');actions.className='actions';const listen=document.createElement('button');listen.className='listen';listen.textContent='▶ Anhören';listen.type='button';const record=document.createElement('button');record.className='record';record.textContent='● Aufnehmen';record.type='button';const mine=document.createElement('button');mine.className='mine';mine.textContent='▶ Meine Aufnahme';mine.type='button';mine.disabled=true;const del=document.createElement('button');del.className='delete';del.textContent='▤ Löschen';del.type='button';del.disabled=true;const status=document.createElement('div');status.className='status';status.setAttribute('aria-live','polite');actions.append(listen,record,mine,del);card.append(n,texts,actions,status);document.getElementById('lesson').append(card);getRecording(id).then(saved=>{if(saved?.blob){mine.disabled=false;del.disabled=false}}).catch(()=>{});listen.addEventListener('click',async()=>{stopPlayback();document.querySelectorAll('.status').forEach(x=>x.textContent='');const audio=new Audio(lesson.tracks[index]);currentPlayback=audio;audio.onended=()=>{if(currentPlayback===audio)currentPlayback=null;show(card,'Wiedergabe beendet.')};audio.onerror=()=>{if(currentPlayback===audio)currentPlayback=null;show(card,'MP3-Datei konnte nicht geladen werden.')};show(card,'Wiedergabe läuft …');try{await audio.play()}catch(e){if(currentPlayback===audio)currentPlayback=null;show(card,'Wiedergabe fehlgeschlagen: '+(e.message||'Audiofehler'))}});mine.addEventListener('click',async()=>{stopPlayback();try{const saved=await getRecording(id);if(!saved?.blob){mine.disabled=true;del.disabled=true;show(card,'Noch keine eigene Aufnahme vorhanden.');return}const audio=new Audio(URL.createObjectURL(saved.blob));currentPlayback=audio;audio.onended=()=>{if(currentPlayback===audio)currentPlayback=null;show(card,'Deine Aufnahme beendet.')};audio.onerror=()=>show(card,'Deine Aufnahme konnte nicht abgespielt werden.');show(card,'Deine Aufnahme läuft …');await audio.play()}catch(e){show(card,'Aufnahme konnte nicht geladen werden.')}});del.addEventListener('click',async()=>{try{await deleteRecording(id);mine.disabled=true;del.disabled=true;show(card,'Eigene Aufnahme gelöscht.')}catch(e){show(card,'Löschen fehlgeschlagen.')}});record.addEventListener('click',async()=>{if(activeRecorder&&activeRecorder.state==='recording'){if(activeCard!==card){show(card,'Beende zuerst die andere Aufnahme.');return}record.disabled=true;show(card,'Aufnahme wird gespeichert …');activeRecorder.stop();return}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){show(card,'Aufnehmen wird von diesem Browser nicht unterstützt.');return}record.disabled=true;show(card,'Mikrofon wird gestartet …');try{const stream=await navigator.mediaDevices.getUserMedia({audio:true}),localChunks=[];activeStream=stream;activeCard=card;const recorder=new MediaRecorder(stream);activeRecorder=recorder;recorder.ondataavailable=e=>{if(e.data.size)localChunks.push(e.data)};recorder.onstop=async()=>{try{const blob=new Blob(localChunks,{type:recorder.mimeType||localChunks[0]?.type||'audio/webm'});if(!blob.size)throw new Error('Keine Audiodaten.');await saveRecording({id,blob,savedAt:Date.now()});mine.disabled=false;del.disabled=false;show(card,'Aufnahme gespeichert.')}catch(e){show(card,'Aufnahme nicht gespeichert: '+(e.message||'Fehler'))}finally{stream.getTracks().forEach(t=>t.stop());activeRecorder=null;activeStream=null;activeCard=null;record.disabled=false;record.classList.remove('recording');record.textContent='● Aufnehmen'}};recorder.start();record.classList.add('recording');record.textContent='■ Aufnahme stoppen';record.disabled=false;show(card,'Aufnahme läuft – sprich und tippe danach auf „Aufnahme stoppen“.')}catch(e){record.disabled=false;show(card,e.name==='NotAllowedError'?'Mikrofonzugriff nicht erlaubt. Bitte den Browserzugriff erlauben.':'Mikrofon konnte nicht gestartet werden. Fehlercode: '+(e.name||'unbekannt'))}})}lesson.items.forEach((item,index)=>{if(index===lesson.sentenceCount){const h=document.createElement('h2');h.className='section-heading';h.textContent='Wortschatz';document.getElementById('lesson').append(h)}const isWord=index>=lesson.sentenceCount;addCard(item,index,isWord?'wort':'satz',isWord?index-lesson.sentenceCount:index)});document.getElementById('deleteAll').addEventListener('click',async()=>{if(activeRecorder?.state==='recording'){show(activeCard,'Beende zuerst die laufende Aufnahme.');return}try{const db=await openDB();await new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).clear();tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});document.querySelectorAll('.mine,.delete').forEach(b=>b.disabled=true);document.querySelectorAll('.status').forEach(s=>s.textContent='')}catch(e){alert('Aufnahmen konnten nicht gelöscht werden.')}});window.addEventListener('pagehide',()=>{stopPlayback();if(activeRecorder?.state==='recording')activeRecorder.stop();if(activeStream)activeStream.getTracks().forEach(t=>t.stop())});</script></body></html>
