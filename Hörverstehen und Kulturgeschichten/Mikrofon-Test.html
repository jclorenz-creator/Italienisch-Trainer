<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mikrofon-Test · Hörverstehen und Kulturgeschichten</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}
body{margin:0;padding:24px;background:#f3f5fa;color:#253047;font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:720px;margin:40px auto;background:white;padding:28px;border-radius:18px;box-shadow:0 2px 12px #00000012}
h1{font-size:1.8rem;margin:0 0 10px}p{color:#667085}
.status{padding:14px 16px;border-radius:10px;background:#f1f5f9;margin:20px 0}
.actions{display:flex;gap:10px;flex-wrap:wrap}
button{border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer;background:#176b55;color:white}
button.secondary{background:#eef2f6;color:#253047}
button:disabled{opacity:.5;cursor:not-allowed}
audio{display:block;width:100%;margin-top:18px}
a{display:inline-block;margin-top:22px;color:#1767c2}
.small{font-size:.92rem}
</style>
</head>
<body><main>
<h1>🎙️ Mikrofon testen</h1>
<p>Mit dieser Seite kannst du prüfen, ob die Aufnahme im Browser funktioniert.</p>
<div class="status" id="status" role="status" aria-live="polite">Klicke auf „Aufnahme starten“ und erlaube den Mikrofonzugriff, falls Chrome danach fragt.</div>
<div class="actions">
<button id="start">Aufnahme starten</button>
<button id="stop" class="secondary" disabled>Aufnahme beenden</button>
<button id="clear" class="secondary" disabled>Aufnahme löschen</button>
</div>
<audio id="playback" controls hidden></audio>
<p class="small">Die Aufnahme bleibt nur in diesem Browserfenster. Sie wird nicht hochgeladen oder gespeichert.</p>
<a href="./">← Zur Übersicht</a>
</main>
<script>
const statusBox=document.getElementById("status");
const startBtn=document.getElementById("start");
const stopBtn=document.getElementById("stop");
const clearBtn=document.getElementById("clear");
const playback=document.getElementById("playback");
let recorder=null,stream=null,chunks=[],audioUrl=null;
function setStatus(text){statusBox.textContent=text}
function releaseStream(){if(stream){stream.getTracks().forEach(track=>track.stop());stream=null}}
function clearRecording(){
  playback.pause(); playback.removeAttribute("src"); playback.hidden=true;
  if(audioUrl){URL.revokeObjectURL(audioUrl);audioUrl=null}
  chunks=[]; clearBtn.disabled=true;
}
startBtn.addEventListener("click",async()=>{
  clearRecording();
  if(!navigator.mediaDevices?.getUserMedia){setStatus("Dieser Browser kann hier keinen Mikrofonzugriff bereitstellen. Öffne die Seite in Chrome über HTTPS.");return}
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const options=MediaRecorder.isTypeSupported("audio/webm;codecs=opus")?{mimeType:"audio/webm;codecs=opus"}:{};
    recorder=new MediaRecorder(stream,options);
    chunks=[];
    recorder.addEventListener("dataavailable",event=>{if(event.data.size)chunks.push(event.data)});
    recorder.addEventListener("stop",()=>{
      const blob=new Blob(chunks,{type:recorder.mimeType||"audio/webm"});
      audioUrl=URL.createObjectURL(blob);
      playback.src=audioUrl; playback.hidden=false; clearBtn.disabled=false;
      setStatus("Aufnahme fertig. Drücke ▶, um sie anzuhören.");
      releaseStream();startBtn.disabled=false;stopBtn.disabled=true;
    });
    recorder.start();
    setStatus("Aufnahme läuft – sprich jetzt kurz ins Mikrofon.");
    startBtn.disabled=true;stopBtn.disabled=false;
  }catch(error){
    releaseStream();
    if(error.name==="NotAllowedError"||error.name==="PermissionDeniedError")setStatus("Chrome hat den Mikrofonzugriff verweigert. Erlaube ihn für jclorenz-creator.github.io in den Website-Einstellungen und lade diese Seite neu.");
    else if(error.name==="NotFoundError"||error.name==="DevicesNotFoundError")setStatus("Kein Mikrofon gefunden. Prüfe unter macOS Systemeinstellungen → Ton → Eingabe, ob ein Mikrofon ausgewählt ist.");
    else if(error.name==="NotReadableError"||error.name==="TrackStartError")setStatus("Das Mikrofon ist belegt oder kann nicht gestartet werden. Schließe andere Programme, die es verwenden, und versuche es nochmals.");
    else setStatus("Mikrofonzugriff fehlgeschlagen: "+(error.message||error.name));
  }
});
stopBtn.addEventListener("click",()=>{if(recorder&&recorder.state!=="inactive")recorder.stop()});
clearBtn.addEventListener("click",()=>{clearRecording();setStatus("Aufnahme gelöscht. Du kannst erneut testen.")});
window.addEventListener("pagehide",releaseStream);
</script></body></html>
