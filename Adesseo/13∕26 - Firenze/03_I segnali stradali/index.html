<!doctype html><html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>03_I segnali stradali</title><style>
:root{color-scheme:light;--ink:#182126;--muted:#657178;--line:#e5e9ed;--paper:#f4f5f8;--green:#176b56;--blue:#e7f0ff;--red:#fff0f0;--mint:#edf8f2;--grey:#f1f2f4;--yellow:#fff6d8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1440px;margin:0 auto;padding:28px 22px 50px}header{margin-bottom:20px}.back{color:#65439a;text-decoration:underline;font-weight:650}.eyebrow{display:none}h1{font-size:clamp(1.7rem,3vw,2.25rem);line-height:1.15;margin:16px 0 2px}header p{color:var(--muted);margin:0}.pdf{color:var(--green);font-size:.92rem;font-weight:600}.notice{background:var(--yellow);border-radius:12px;padding:13px 16px;margin:20px 0 16px}.all-delete{appearance:none;border:0;border-radius:10px;background:#eceef1;padding:11px 16px;font:600 .95rem system-ui;color:#252a30;cursor:pointer;margin:0 0 10px}.all-delete:hover{background:#e1e4e8}.card{display:grid;grid-template-columns:54px minmax(250px,1fr) auto;align-items:center;gap:12px 16px;background:#fff;border:1px solid var(--line);border-radius:17px;padding:13px 16px;margin:11px 0;box-shadow:0 2px 8px #00000009}.num{font-size:1rem;font-weight:750;color:#686f77;text-align:center}.text{min-width:0}.it{font-size:1.12rem;font-weight:700;line-height:1.28;margin:0 0 3px}.de{font-size:1rem;color:#69717a;margin:0}.actions{display:flex;gap:10px;align-items:center}.actions button{appearance:none;border:0;border-radius:13px;padding:13px 16px;font:600 .93rem system-ui;white-space:nowrap;cursor:pointer;color:#20242a}.listen{background:var(--blue)}.record{background:var(--red)}.mine{background:var(--mint)}.delete{background:var(--grey)}.actions button:hover:not(:disabled){filter:brightness(.97)}.actions button:disabled{opacity:.5;cursor:not-allowed}.actions .recording{background:#b42318;color:white}.status{grid-column:2/-1;min-height:0;font-size:.82rem;color:var(--muted)}.status:empty{display:none}.note{color:var(--muted);font-size:.88rem;margin:18px 0 0}@media(max-width:1050px){.card{grid-template-columns:42px minmax(220px,1fr)}.actions{grid-column:2;flex-wrap:wrap}.status{grid-column:2}.actions button{padding:10px 13px}}@media(max-width:560px){main{padding:20px 12px 36px}.card{grid-template-columns:34px minmax(0,1fr);gap:8px;padding:12px}.it{font-size:1rem}.de{font-size:.92rem}.actions{gap:6px}.actions button{font-size:.83rem;padding:9px 10px}}

</style></head><body><main><header><a class="back" href="../index.html">← Zurück zu ADESSO</a><h1>03_I segnali stradali</h1><p>20 Sätze · 20 Wörter</p><a class="pdf" href="I_segnali_stradali_Satz_fuer_Satz.pdf" target="_blank" rel="noopener">PDF mit Text und Übersetzung öffnen</a></header><div class="notice">Beim ersten Klick auf „Aufnehmen“ bitte den Mikrofonzugriff erlauben.</div><button class="all-delete" id="deleteAll" type="button">🗑 Alle Aufnahmen löschen</button><section id="lesson" aria-label="Italienische Sätze mit Übersetzung"></section><p class="note">Deine Aufnahmen werden nur in diesem Browser gespeichert und bleiben von anderen Lektionen getrennt.</p></main>
<script>'use strict';const lesson={"items":[["Durante una passeggiata a piedi, un giro in bicicletta o un viaggio in macchina dobbiamo sempre fare attenzione ai segnali stradali.","Beim Spaziergang, bei einer Velotour oder bei einer Autofahrt müssen wir immer auf die Verkehrsschilder achten."],["Alcuni li abbiamo imparati da bambini, altri da adulti frequentando la scuola guida.","Einige haben wir als Kinder gelernt, andere als Erwachsene in der Fahrschule."],["Certo è che non possiamo proprio non conoscerli.","Fest steht: Wir müssen sie unbedingt kennen."],["Li vediamo tutti i giorni sul margine della strada.","Wir sehen sie jeden Tag am Strassenrand."],["E spesso non li notiamo, o li notiamo troppo tardi.","Und oft nehmen wir sie nicht wahr oder bemerken sie zu spät."],["I segnali stradali sono una parte importante della nostra vita, soprattutto se viaggiamo in auto.","Verkehrsschilder sind ein wichtiger Teil unseres Lebens, besonders wenn wir mit dem Auto unterwegs sind."],["Il segnale blu con una barra rossa obliqua significa divieto di sosta.","Das blaue Schild mit einem schrägen roten Balken bedeutet Parkverbot."],["Il cerchio rosso con un numero in mezzo, ad esempio il 30, indica un limite di velocità.","Der rote Kreis mit einer Zahl in der Mitte, zum Beispiel der Zahl 30, zeigt eine Geschwindigkeitsbegrenzung an."],["E il cerchio rosso con una barra bianca orizzontale in mezzo? Senso vietato.","Und was bedeutet der rote Kreis mit einem waagrechten weissen Balken in der Mitte? Einfahrt verboten."],["Significa che la strada è a senso unico e si può percorrere solo in una direzione e non nell’altra.","Das bedeutet, dass die Strasse eine Einbahnstrasse ist und nur in eine Richtung befahren werden darf."],["Quest’ultimo segnale si può confondere facilmente con un altro segnale, il cerchio bianco con il bordo rosso, che significa divieto di transito.","Dieses Schild kann leicht mit einem anderen verwechselt werden: dem weissen Kreis mit rotem Rand, der ein Durchfahrtsverbot bedeutet."],["In questo caso non si può entrare in quella strada, né in un senso, né nell’altro.","In diesem Fall darf man nicht in diese Strasse hineinfahren, weder in die eine noch in die andere Richtung."],["Molto importanti sono i segnali che indicano chi ha la precedenza.","Sehr wichtig sind die Schilder, die anzeigen, wer Vortritt hat."],["E anche quelli che indicano una strada senza uscita, o vicolo cieco.","Wichtig sind auch die Schilder, die auf eine Sackgasse hinweisen."],["Attenzione, poi, a un’altra cosa.","Achten wir ausserdem noch auf etwas anderes."],["I segnali stradali non sono solo quelli verticali.","Verkehrsschilder sind nicht nur die senkrecht aufgestellten Schilder."],["Ci sono anche quelli disegnati sulla strada.","Es gibt auch Markierungen, die auf die Strasse gemalt sind."],["Ad esempio, le strisce pedonali e la linea di mezzeria che divide le corsie di una strada.","Zum Beispiel Fussgängerstreifen und die Mittellinie, welche die Fahrspuren einer Strasse voneinander trennt."],["Infine, non dimentichiamo i semafori e i loro tre colori: il rosso, il giallo e il verde.","Vergessen wir zum Schluss auch die Ampeln und ihre drei Farben nicht: Rot, Gelb und Grün."],["Ricordiamo che i semafori, in Italia, funzionano in modo un po’ diverso: il giallo viene dopo il verde e prima del rosso, non dopo il rosso e prima del verde!","Denken wir daran, dass Ampeln in Italien ein wenig anders funktionieren: Gelb kommt nach Grün und vor Rot, nicht nach Rot und vor Grün!"],["il segnale stradale","Verkehrsschild"],["il margine della strada","Strassenrand"],["notare","bemerken"],["viaggiare","fahren"],["la barra","Balken"],["il divieto di sosta","Halteverbot, Parkverbot"],["il cerchio","Kreis"],["il numero","Zahl"],["il limite di velocità","Tempolimit"],["il senso vietato","Einfahrt verboten"],["il senso unico","Einbahnstrasse"],["percorrere","fahren"],["confondere","verwechseln"],["il divieto di transito","Durchfahrtsverbot"],["la precedenza","Vortritt"],["la strada senza uscita, il vicolo cieco","Sackgasse"],["le strisce pedonali","Zebrastreifen"],["la linea di mezzeria","Mittellinie"],["la corsia","Spur"],["il semaforo","Ampel"]],"tracks":["Satz 01.mp3","Satz 02.mp3","Satz 03.mp3","Satz 04.mp3","Satz 05.mp3","Satz 06.mp3","Satz 07.mp3","Satz 08.mp3","Satz 09.mp3","Satz 10.mp3","Satz 11.mp3","Satz 12.mp3","Satz 13.mp3","Satz 14.mp3","Satz 15.mp3","Satz 16.mp3","Satz 17.mp3","Satz 18.mp3","Satz 19.mp3","Satz 20.mp3","Wort 01.mp3","Wort 02.mp3","Wort 03.mp3","Wort 04.mp3","Wort 05.mp3","Wort 06.mp3","Wort 07.mp3","Wort 08.mp3","Wort 09.mp3","Wort 10.mp3","Wort 11.mp3","Wort 12.mp3","Wort 13.mp3","Wort 14.mp3","Wort 15.mp3","Wort 16.mp3","Wort 17.mp3","Wort 18.mp3","Wort 19.mp3","Wort 20.mp3"]};const DB_NAME='jc-italienisch-adasseo-03-i-segnali-stradali',STORE='recordings';let dbPromise,currentPlayback=null,activeRecorder=null,activeStream=null,activeCard=null;
function openDB(){if(!dbPromise)dbPromise=new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(STORE))req.result.createObjectStore(STORE,{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});return dbPromise}async function getRecording(id){const db=await openDB();return new Promise((resolve,reject)=>{const req=db.transaction(STORE).objectStore(STORE).get(id);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}async function saveRecording(item){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(item);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}async function deleteRecording(id){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}function show(card,msg){card.querySelector('.status').textContent=msg}function stopPlayback(){if(currentPlayback){currentPlayback.pause();currentPlayback.currentTime=0;currentPlayback=null}}
function addCard(item,index,type='satz',displayIndex=index){const num=String(displayIndex+1).padStart(2,'0'),id=type+'-'+num,card=document.createElement('article');card.className='card';const n=document.createElement('div');n.className='num';n.textContent=num;const texts=document.createElement('div');texts.className='text';const it=document.createElement('p');it.className='it';it.lang='it';it.textContent=item[0];const de=document.createElement('p');de.className='de';de.lang='de';de.textContent=item[1];texts.append(it,de);const actions=document.createElement('div');actions.className='actions';const listen=document.createElement('button');listen.className='listen';listen.textContent='▶ Anhören';listen.type='button';const record=document.createElement('button');record.className='record';record.textContent='● Aufnehmen';record.type='button';const mine=document.createElement('button');mine.className='mine';mine.textContent='▶ Meine Aufnahme';mine.type='button';mine.disabled=true;const del=document.createElement('button');del.className='delete';del.textContent='🗑 Löschen';del.type='button';del.disabled=true;const status=document.createElement('div');status.className='status';status.setAttribute('aria-live','polite');actions.append(listen,record,mine,del);card.append(n,texts,actions,status);document.getElementById('lesson').append(card);
getRecording(id).then(saved=>{if(saved?.blob){mine.disabled=false;del.disabled=false}}).catch(()=>{});
listen.addEventListener('click',async()=>{stopPlayback();document.querySelectorAll('.status').forEach(x=>x.textContent='');const audio=new Audio(encodeURIComponent(lesson.tracks[index]));currentPlayback=audio;audio.onended=()=>{if(currentPlayback===audio)currentPlayback=null;show(card,'Wiedergabe beendet.')};audio.onerror=()=>{if(currentPlayback===audio)currentPlayback=null;show(card,'MP3-Datei konnte nicht geladen werden.')};show(card,'Wiedergabe läuft …');try{await audio.play()}catch(e){if(currentPlayback===audio)currentPlayback=null;show(card,'Wiedergabe fehlgeschlagen: '+(e.message||'Audiofehler'))}});
mine.addEventListener('click',async()=>{stopPlayback();try{const saved=await getRecording(id);if(!saved?.blob){mine.disabled=true;del.disabled=true;show(card,'Noch keine eigene Aufnahme vorhanden.');return}const audio=new Audio(URL.createObjectURL(saved.blob));currentPlayback=audio;audio.onended=()=>{if(currentPlayback===audio)currentPlayback=null;show(card,'Deine Aufnahme beendet.')};audio.onerror=()=>show(card,'Deine Aufnahme konnte nicht abgespielt werden.');show(card,'Deine Aufnahme läuft …');await audio.play()}catch(e){show(card,'Aufnahme konnte nicht geladen werden.')}});
del.addEventListener('click',async()=>{try{await deleteRecording(id);mine.disabled=true;del.disabled=true;show(card,'Eigene Aufnahme gelöscht.')}catch(e){show(card,'Löschen fehlgeschlagen.')}});
record.addEventListener('click',async()=>{if(activeRecorder&&activeRecorder.state==='recording'){if(activeCard!==card){show(card,'Beende zuerst die andere Aufnahme.');return}record.disabled=true;show(card,'Aufnahme wird gespeichert …');activeRecorder.stop();return}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){show(card,'Aufnehmen wird von diesem Browser nicht unterstützt.');return}record.disabled=true;show(card,'Mikrofon wird gestartet …');try{const stream=await navigator.mediaDevices.getUserMedia({audio:true}),localChunks=[];activeStream=stream;activeCard=card;const recorder=new MediaRecorder(stream);activeRecorder=recorder;recorder.ondataavailable=e=>{if(e.data.size)localChunks.push(e.data)};recorder.onstop=async()=>{try{const blob=new Blob(localChunks,{type:recorder.mimeType||localChunks[0]?.type||'audio/webm'});if(!blob.size)throw new Error('Keine Audiodaten.');await saveRecording({id,blob,savedAt:Date.now()});mine.disabled=false;del.disabled=false;show(card,'Aufnahme gespeichert.')}catch(e){show(card,'Aufnahme nicht gespeichert: '+(e.message||'Fehler'))}finally{stream.getTracks().forEach(t=>t.stop());activeRecorder=null;activeStream=null;activeCard=null;record.disabled=false;record.classList.remove('recording');record.textContent='● Aufnehmen'}};recorder.start();record.classList.add('recording');record.textContent='■ Aufnahme stoppen';record.disabled=false;show(card,'Aufnahme läuft – sprich und tippe danach auf „Aufnahme stoppen“.')}catch(e){record.disabled=false;show(card,e.name==='NotAllowedError'?'Mikrofonzugriff nicht erlaubt. Bitte den Browserzugriff erlauben.':'Mikrofon konnte nicht gestartet werden. Fehlercode: '+(e.name||'unbekannt'))}})}
lesson.items.forEach((item,index)=>{if(index===20){const h=document.createElement('h2');h.className='section-heading';h.textContent='Wortschatz';document.getElementById('lesson').append(h)}addCard(item,index,index>=20?'wort':'satz',index>=20?index-20:index)});document.getElementById('deleteAll').addEventListener('click',async()=>{if(activeRecorder?.state==='recording'){show(activeCard,'Beende zuerst die laufende Aufnahme.');return}try{const db=await openDB();await new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).clear();tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});document.querySelectorAll('.mine,.delete').forEach(b=>b.disabled=true);document.querySelectorAll('.status').forEach(s=>s.textContent='');}catch(e){alert('Aufnahmen konnten nicht gelöscht werden.')}});window.addEventListener('pagehide',()=>{stopPlayback();if(activeRecorder?.state==='recording')activeRecorder.stop();if(activeStream)activeStream.getTracks().forEach(t=>t.stop())});</script></body></html>
