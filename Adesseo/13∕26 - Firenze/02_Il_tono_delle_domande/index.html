<!doctype html><html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>02_Il_tono_delle_domande</title><style>
:root{color-scheme:light;--ink:#182126;--muted:#657178;--line:#e5e9ed;--paper:#f4f5f8;--green:#176b56;--blue:#e7f0ff;--red:#fff0f0;--mint:#edf8f2;--grey:#f1f2f4;--yellow:#fff6d8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1440px;margin:0 auto;padding:28px 22px 50px}header{margin-bottom:20px}.back{color:#65439a;text-decoration:underline;font-weight:650}.eyebrow{display:none}h1{font-size:clamp(1.7rem,3vw,2.25rem);line-height:1.15;margin:16px 0 2px}header p{color:var(--muted);margin:0}.pdf{color:var(--green);font-size:.92rem;font-weight:600}.notice{background:var(--yellow);border-radius:12px;padding:13px 16px;margin:20px 0 16px}.all-delete{appearance:none;border:0;border-radius:10px;background:#eceef1;padding:11px 16px;font:600 .95rem system-ui;color:#252a30;cursor:pointer;margin:0 0 10px}.all-delete:hover{background:#e1e4e8}.card{display:grid;grid-template-columns:54px minmax(250px,1fr) auto;align-items:center;gap:12px 16px;background:#fff;border:1px solid var(--line);border-radius:17px;padding:13px 16px;margin:11px 0;box-shadow:0 2px 8px #00000009}.num{font-size:1rem;font-weight:750;color:#686f77;text-align:center}.text{min-width:0}.it{font-size:1.12rem;font-weight:700;line-height:1.28;margin:0 0 3px}.de{font-size:1rem;color:#69717a;margin:0}.actions{display:flex;gap:10px;align-items:center}.actions button{appearance:none;border:0;border-radius:13px;padding:13px 16px;font:600 .93rem system-ui;white-space:nowrap;cursor:pointer;color:#20242a}.listen{background:var(--blue)}.record{background:var(--red)}.mine{background:var(--mint)}.delete{background:var(--grey)}.actions button:hover:not(:disabled){filter:brightness(.97)}.actions button:disabled{opacity:.5;cursor:not-allowed}.actions .recording{background:#b42318;color:white}.status{grid-column:2/-1;min-height:0;font-size:.82rem;color:var(--muted)}.status:empty{display:none}.note{color:var(--muted);font-size:.88rem;margin:18px 0 0}@media(max-width:1050px){.card{grid-template-columns:42px minmax(220px,1fr)}.actions{grid-column:2;flex-wrap:wrap}.status{grid-column:2}.actions button{padding:10px 13px}}@media(max-width:560px){main{padding:20px 12px 36px}.card{grid-template-columns:34px minmax(0,1fr);gap:8px;padding:12px}.it{font-size:1rem}.de{font-size:.92rem}.actions{gap:6px}.actions button{font-size:.83rem;padding:9px 10px}}
</style></head><body><main><header><a class="back" href="../index.html">← Zurück zu ADESSO</a><h1>02_Il_tono_delle_domande</h1><p>16 Sprecheinheiten</p><a class="pdf" href="Il_tono_delle_domande.pdf" target="_blank" rel="noopener">PDF mit Text und Übersetzung öffnen</a></header><div class="notice">Beim ersten Klick auf „Aufnehmen“ bitte den Mikrofonzugriff erlauben.</div><button class="all-delete" id="deleteAll" type="button">🗑 Alle Aufnahmen löschen</button><section id="lesson" aria-label="Italienische Sätze mit Übersetzung"></section><p class="note">Deine Aufnahmen werden nur in diesem Browser gespeichert und bleiben von anderen Lektionen getrennt.</p></main><script>'use strict';const lesson={"items":[["In italiano, l’intonazione della frase interrogativa di solito è ascendente: il tono della voce sale verso la fine della domanda.","Im Italienischen steigt die Intonation eines Fragesatzes normalerweise an: Die Stimme hebt sich gegen Ende der Frage."],["Questo vale per le cosiddette domande totali, quelle che riguardano tutta la frase e richiedono come risposta sì o no.","Das gilt für sogenannte Entscheidungsfragen. Sie beziehen sich auf den ganzen Satz und verlangen als Antwort ein Ja oder Nein."],["Per esempio: Ti va un aperitivo?","Zum Beispiel: Hast du Lust auf einen Aperitif?"],["Invece nelle domande parziali, che riguardano solo una parte della frase, il tono della voce si concentra sulla parola iniziale e tende a scendere verso la fine.","Bei Ergänzungsfragen hingegen, die sich nur auf einen Teil des Satzes beziehen, liegt die Betonung auf dem Fragewort am Anfang. Gegen Ende sinkt die Stimme meist ab."],["Le domande parziali, usate spesso per chiedere un’informazione, sono introdotte da chi, cosa, dove, quando, quanto, quale…","Ergänzungsfragen werden oft verwendet, um nach einer Information zu fragen. Sie beginnen mit Fragewörtern wie wer, was, wo, wann, wie viel oder welcher …"],["Per esempio: Quanto costa un chilo di ciliegie?","Zum Beispiel: Wie viel kostet ein Kilo Kirschen?"],["Ascoltate le seguenti domande, facendo particolarmente attenzione all’intonazione.","Hört euch die folgenden Fragen an und achtet dabei besonders auf die Intonation."],["Ripetetele più volte e decidete se si tratta di domande totali, con tono ascendente, oppure domande parziali, con tono leggermente discendente verso la fine.","Wiederholt sie mehrmals und entscheidet, ob es sich um Entscheidungsfragen mit steigender Intonation oder um Ergänzungsfragen mit leicht sinkender Intonation gegen Ende handelt."],["Ti piace questo piatto?","Schmeckt dir dieses Gericht?"],["Si tratta di una domanda totale, quindi il tono della voce sale verso la fine della frase.","Das ist eine Entscheidungsfrage. Deshalb hebt sich die Stimme gegen Ende des Satzes."],["Quale vestito hai scelto?","Welches Kleidungsstück hast du ausgewählt?"],["È una domanda parziale: il tono della voce tende a scendere verso la fine.","Das ist eine Ergänzungsfrage: Die Stimme sinkt gegen Ende meist ab."],["Chi viene con me?","Wer kommt mit mir?"],["Anche questa è una domanda parziale, quindi la voce sale all’inizio e cala progressivamente verso la fine.","Auch das ist eine Ergänzungsfrage. Daher hebt sich die Stimme am Anfang und sinkt dann nach und nach zum Satzende hin."],["Andiamo al mare?","Gehen wir ans Meer?"],["Questo è un esempio di domanda totale: l’intonazione è ascendente.","Das ist ein Beispiel für eine Entscheidungsfrage: Die Intonation steigt zum Satzende hin an."]],"tracks":["Satz 01.mp3","Satz 02.mp3","Satz 03.mp3","Satz 04.mp3","Satz 05.mp3","Satz 06.mp3","Satz 09.mp3","Satz 10.mp3","Satz 11.mp3","Satz 12.mp3","Satz 15.mp3","Satz 16.mp3","Satz 17.mp3","Satz 18.mp3","Satz 19.mp3","Satz 20.mp3"]};const DB_NAME='jc-italienisch-adasseo-tono-domande',STORE='recordings';let dbPromise,currentPlayback=null,activeRecorder=null,activeStream=null,activeCard=null;
function openDB(){if(!dbPromise)dbPromise=new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(STORE))req.result.createObjectStore(STORE,{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});return dbPromise}async function getRecording(id){const db=await openDB();return new Promise((resolve,reject)=>{const req=db.transaction(STORE).objectStore(STORE).get(id);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}async function saveRecording(item){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(item);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}async function deleteRecording(id){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}function show(card,msg){card.querySelector('.status').textContent=msg}function stopPlayback(){if(currentPlayback){currentPlayback.pause();currentPlayback.currentTime=0;currentPlayback=null}}
function addCard(item,index){const num=String(index+1).padStart(2,'0'),id='satz-'+num,card=document.createElement('article');card.className='card';const n=document.createElement('div');n.className='num';n.textContent=num;const texts=document.createElement('div');texts.className='text';const it=document.createElement('p');it.className='it';it.lang='it';it.textContent=item[0];const de=document.createElement('p');de.className='de';de.lang='de';de.textContent=item[1];texts.append(it,de);const actions=document.createElement('div');actions.className='actions';const listen=document.createElement('button');listen.className='listen';listen.textContent='▶ Anhören';listen.type='button';const record=document.createElement('button');record.className='record';record.textContent='● Aufnehmen';record.type='button';const mine=document.createElement('button');mine.className='mine';mine.textContent='▶ Meine Aufnahme';mine.type='button';mine.disabled=true;const del=document.createElement('button');del.className='delete';del.textContent='🗑 Löschen';del.type='button';del.disabled=true;const status=document.createElement('div');status.className='status';status.setAttribute('aria-live','polite');actions.append(listen,record,mine,del);card.append(n,texts,actions,status);document.getElementById('lesson').append(card);
getRecording(id).then(saved=>{if(saved?.blob){mine.disabled=false;del.disabled=false}}).catch(()=>{});
listen.addEventListener('click',async()=>{stopPlayback();document.querySelectorAll('.status').forEach(x=>x.textContent='');const audio=new Audio(encodeURIComponent(lesson.tracks[index]));currentPlayback=audio;audio.onended=()=>{if(currentPlayback===audio)currentPlayback=null;show(card,'Wiedergabe beendet.')};audio.onerror=()=>{if(currentPlayback===audio)currentPlayback=null;show(card,'MP3-Datei konnte nicht geladen werden.')};show(card,'Wiedergabe läuft …');try{await audio.play()}catch(e){if(currentPlayback===audio)currentPlayback=null;show(card,'Wiedergabe fehlgeschlagen: '+(e.message||'Audiofehler'))}});
mine.addEventListener('click',async()=>{stopPlayback();try{const saved=await getRecording(id);if(!saved?.blob){mine.disabled=true;del.disabled=true;show(card,'Noch keine eigene Aufnahme vorhanden.');return}const audio=new Audio(URL.createObjectURL(saved.blob));currentPlayback=audio;audio.onended=()=>{if(currentPlayback===audio)currentPlayback=null;show(card,'Deine Aufnahme beendet.')};audio.onerror=()=>show(card,'Deine Aufnahme konnte nicht abgespielt werden.');show(card,'Deine Aufnahme läuft …');await audio.play()}catch(e){show(card,'Aufnahme konnte nicht geladen werden.')}});
del.addEventListener('click',async()=>{try{await deleteRecording(id);mine.disabled=true;del.disabled=true;show(card,'Eigene Aufnahme gelöscht.')}catch(e){show(card,'Löschen fehlgeschlagen.')}});
record.addEventListener('click',async()=>{if(activeRecorder&&activeRecorder.state==='recording'){if(activeCard!==card){show(card,'Beende zuerst die andere Aufnahme.');return}record.disabled=true;show(card,'Aufnahme wird gespeichert …');activeRecorder.stop();return}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){show(card,'Aufnehmen wird von diesem Browser nicht unterstützt.');return}record.disabled=true;show(card,'Mikrofon wird gestartet …');try{const stream=await navigator.mediaDevices.getUserMedia({audio:true}),localChunks=[];activeStream=stream;activeCard=card;const recorder=new MediaRecorder(stream);activeRecorder=recorder;recorder.ondataavailable=e=>{if(e.data.size)localChunks.push(e.data)};recorder.onstop=async()=>{try{const blob=new Blob(localChunks,{type:recorder.mimeType||localChunks[0]?.type||'audio/webm'});if(!blob.size)throw new Error('Keine Audiodaten.');await saveRecording({id,blob,savedAt:Date.now()});mine.disabled=false;del.disabled=false;show(card,'Aufnahme gespeichert.')}catch(e){show(card,'Aufnahme nicht gespeichert: '+(e.message||'Fehler'))}finally{stream.getTracks().forEach(t=>t.stop());activeRecorder=null;activeStream=null;activeCard=null;record.disabled=false;record.classList.remove('recording');record.textContent='● Aufnehmen'}};recorder.start();record.classList.add('recording');record.textContent='■ Aufnahme stoppen';record.disabled=false;show(card,'Aufnahme läuft – sprich und tippe danach auf „Aufnahme stoppen“.')}catch(e){record.disabled=false;show(card,e.name==='NotAllowedError'?'Mikrofonzugriff nicht erlaubt. Bitte den Browserzugriff erlauben.':'Mikrofon konnte nicht gestartet werden. Fehlercode: '+(e.name||'unbekannt'))}})}
lesson.items.forEach(addCard);document.getElementById('deleteAll').addEventListener('click',async()=>{if(activeRecorder?.state==='recording'){show(activeCard,'Beende zuerst die laufende Aufnahme.');return}try{const db=await openDB();await new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).clear();tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});document.querySelectorAll('.mine,.delete').forEach(b=>b.disabled=true);document.querySelectorAll('.status').forEach(s=>s.textContent='');}catch(e){alert('Aufnahmen konnten nicht gelöscht werden.')}});window.addEventListener('pagehide',()=>{stopPlayback();if(activeRecorder?.state==='recording')activeRecorder.stop();if(activeStream)activeStream.getTracks().forEach(t=>t.stop())});</script></body></html>
