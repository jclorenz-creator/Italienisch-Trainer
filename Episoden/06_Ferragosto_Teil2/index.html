<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ferragosto in Italia · Teil 2</title><style>body{font:17px system-ui,-apple-system,sans-serif;max-width:850px;margin:auto;padding:18px;background:#f5f7fa;color:#1c2835}h1{font-size:1.7rem}h2{font-size:1.15rem}.card{background:white;border:1px solid #dce1e7;border-radius:12px;padding:17px;margin:13px 0}.it{font-size:1.2rem;font-weight:650}.de{color:#526070;margin:8px 0 13px}.buttons{display:flex;gap:7px;flex-wrap:wrap}button{background:#1559ad;color:white;border:0;border-radius:8px;padding:10px 12px;font-size:15px;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.hint{background:#fff3d4;border-radius:10px;padding:14px;line-height:1.5}audio{width:100%;margin:8px 0}.status{font-size:14px;color:#365575;min-height:1.2em}.num{color:#1559ad}</style></head><body><h1>🇮🇹 Episodio 6 · Ferragosto in Italia</h1><p><strong>Teil 2 · Hören und Nachsprechen</strong></p><p class="hint">Alle 25 Sätze haben eine eigene MP3-Datei. Du kannst jeden Satz einzeln anhören und danach deine Stimme aufnehmen. Bitte kontrolliere die Zuordnung vor dem Hochladen nach GitHub.</p><section class="card"><h2>▶ Vollständige Originalaufnahme</h2><audio controls preload="metadata" src="ferragosto_teil2_gesamt.mp3"></audio></section><main id="lessons"></main><script>
const sentences=[["Per molti italiani, Ferragosto significa mare.", "Für viele Italiener bedeutet Ferragosto Meer."], ["Le spiagge sono affollate.", "Die Strände sind überfüllt."], ["I bambini giocano con la sabbia.", "Die Kinder spielen im Sand."], ["Le nonne tagliano il melone.", "Die Grossmütter schneiden die Melone auf."], ["I papà preparano il barbecue.", "Die Väter bereiten das Grillieren vor."], ["Una radio trasmette canzoni estive.", "Aus einem Radio erklingen Sommerlieder."], ["C’è chi si tuffa.", "Manche springen ins Wasser."], ["Chi ride.", "Andere lachen."], ["Chi brinda.", "Andere stossen miteinander an."], ["In alcune località, come la Riviera Romagnola o il Salento, la giornata si trasforma in una vera festa collettiva.", "In manchen Orten, etwa an der Riviera Romagnola oder im Salento, verwandelt sich der Tag in ein richtiges gemeinsames Fest."], ["Con giochi in spiaggia, tornei di calcetto e falò la sera.", "Mit Strandspielen, kleinen Fussballturnieren und Lagerfeuern am Abend."], ["Il cibo è il protagonista della giornata.", "Das Essen steht an diesem Tag im Mittelpunkt."], ["Il pranzo di Ferragosto è lungo e condiviso.", "Das Ferragosto-Mittagessen dauert lange und wird gemeinsam genossen."], ["Si preparano piatti freschi.", "Man bereitet frische Gerichte zu."], ["Insalata di riso.", "Reissalat."], ["Pasta fredda.", "Kalter Nudelsalat."], ["Frittate.", "Omeletts."], ["Polpette.", "Fleischbällchen."], ["Verdure grigliate.", "Grilliertes Gemüse."], ["Carne o pesce alla brace.", "Fleisch oder Fisch vom Grill."], ["E poi la regina dell’estate: l’anguria.", "Und dann die Königin des Sommers: die Wassermelone."], ["A Ferragosto non manca mai.", "An Ferragosto darf sie niemals fehlen."], ["Tagliata a fette o messa nell’acqua del mare per tenerla fresca.", "In Scheiben geschnitten oder zum Kühlen ins Meerwasser gelegt."], ["Il brindisi si fa con vino bianco o spumante.", "Angestossen wird mit Weisswein oder Schaumwein."], ["Ferragosto senza un grande pranzo è quasi impensabile, è impossibile insomma.", "Ferragosto ohne ein grosses Mittagessen ist fast undenkbar, eigentlich unmöglich."]];
const main=document.getElementById('lessons');
let active=null;
function el(tag,cls,txt){const x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x}
for(let i=0;i<sentences.length;i++){
 const [italian,german]=sentences[i],name='satz_'+String(i+1).padStart(2,'0')+'.mp3';
 const card=el('section','card');card.append(el('div','it',String(i+1).padStart(2,'0')+'. '+italian),el('div','de',german));
 const buttons=el('div','buttons'),listen=el('button','', '▶ Anhören'),rec=el('button','','● Aufnehmen'),stop=el('button','','■ Stopp'),mine=el('button','','▶ Meine Aufnahme'),del=el('button','','🗑 Löschen'),status=el('p','status','');
 const player=new Audio(name);player.preload='none';listen.disabled=false;stop.disabled=true;mine.disabled=true;del.disabled=true;
 // MP3-Verfügbarkeit prüfen, ohne bei fehlenden Dateien falsche Zuordnungen zu erzeugen.
 
 listen.onclick=()=>{if(active&&active.stop)active.stop();player.currentTime=0;player.play().catch(()=>status.textContent='MP3 konnte nicht abgespielt werden.')};
 let recorder=null,chunks=[],url=null,stream=null;
 rec.onclick=async()=>{try{if(active&&active.stop)active.stop();stream=await navigator.mediaDevices.getUserMedia({audio:true});recorder=new MediaRecorder(stream);chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType}));mine.disabled=false;del.disabled=false;stream.getTracks().forEach(t=>t.stop());status.textContent='Aufnahme bereit.';active=null};recorder.start();active={stop:()=>{if(recorder.state==='recording')recorder.stop()}};rec.disabled=true;stop.disabled=false;status.textContent='Aufnahme läuft …'}catch(e){status.textContent='Mikrofonzugriff nicht möglich. Bitte die HTTPS-Seite öffnen und Zugriff erlauben.'}};
 stop.onclick=()=>{if(recorder&&recorder.state==='recording')recorder.stop();rec.disabled=false;stop.disabled=true};
 mine.onclick=()=>{if(url){const a=new Audio(url);a.play().catch(()=>status.textContent='Eigene Aufnahme kann nicht abgespielt werden.')}};
 del.onclick=()=>{if(url)URL.revokeObjectURL(url);url=null;mine.disabled=true;del.disabled=true;status.textContent='Aufnahme gelöscht.'};
 buttons.append(listen,rec,stop,mine,del);card.append(buttons,status);main.append(card)
}
</script></body></html>
