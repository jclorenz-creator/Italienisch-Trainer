<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ferragosto in Italia · Teil 1</title><style>body{font:17px system-ui,sans-serif;max-width:850px;margin:auto;padding:18px;background:#f5f7fb;color:#202735}h1{font-size:27px}article{background:white;border:1px solid #dce1ea;border-radius:13px;padding:17px;margin:14px 0}.it{font-size:20px;font-weight:600}.de{color:#526072;margin:8px 0 12px}button{font-size:15px;background:#1759a5;color:white;border:0;border-radius:7px;padding:10px;margin:4px 5px 4px 0;cursor:pointer}button:disabled{opacity:.4}.status{font-size:14px;color:#48617d}.hint{background:#fff7dd;padding:12px;border-radius:8px}</style></head><body><h1>🇮🇹 Episodio 6 · Ferragosto in Italia</h1><p>Teil 1 · Satz für Satz hören und nachsprechen</p><p class="hint">Die 26 Audiodateien wurden manuell korrigiert. Prüfe die Zuordnung vor dem Hochladen auf GitHub. Für die Mikrofonaufnahme ist HTTPS (GitHub Pages) erforderlich.</p><main id="main"></main><script>
const items=[{"it": "Ferragosto.", "de": "Ferragosto, der Feiertag am 15. August.", "audio": "satz_01.mp3"}, {"it": "Basta la parola per sentire il profumo dell’anguria, il rumore delle cicale e il caldo sulla pelle.", "de": "Schon das Wort lässt uns den Duft der Wassermelone, das Zirpen der Grillen und die Wärme auf der Haut spüren.", "audio": "satz_02.mp3"}, {"it": "È una parola che per gli italiani significa estate e vacanza.", "de": "Für die Italiener bedeutet dieses Wort Sommer und Ferien.", "audio": "satz_03.mp3"}, {"it": "Ma cosa fanno davvero gli italiani il 15 agosto?", "de": "Aber was machen die Italiener am 15. August wirklich?", "audio": "satz_04.mp3"}, {"it": "Oggi ti porto a scoprire la festa estiva per eccellenza: tra storia, tradizione, caos, grigliate improvvisate e tanta voglia di stare insieme.", "de": "Heute entdecken wir das Sommerfest schlechthin: Geschichte, Tradition, Chaos, spontane Grillfeste und die Freude am Zusammensein.", "audio": "satz_05.mp3"}, {"it": "Il Ferragosto non nasce come festa moderna.", "de": "Ferragosto ist kein modernes Fest.", "audio": "satz_06.mp3"}, {"it": "Ha più di duemila anni di storia.", "de": "Es hat eine über zweitausendjährige Geschichte.", "audio": "satz_07.mp3"}, {"it": "Il nome deriva dal latino Feriae Augusti, cioè le ferie di Augusto.", "de": "Der Name stammt vom lateinischen „Feriae Augusti“, also den Feiertagen des Augustus.", "audio": "satz_08.mp3"}, {"it": "L’imperatore Augusto, nel 18 avanti Cristo, ha creato un periodo di riposo dopo la mietitura e la vendemmia, alla fine della stagione dei raccolti.", "de": "Kaiser Augustus führte 18 v. Chr. nach Getreide- und Weinernte eine Ruhezeit zum Ende der Erntesaison ein.", "audio": "satz_09.mp3"}, {"it": "Era un’occasione per ringraziare la natura e celebrare la fine della fatica nei campi.", "de": "Das war eine Gelegenheit, der Natur zu danken und das Ende der harten Feldarbeit zu feiern.", "audio": "satz_10.mp3"}, {"it": "Si organizzavano corse di cavalli, banchetti e giochi popolari.", "de": "Man veranstaltete Pferderennen, Festessen und Volksspiele.", "audio": "satz_11.mp3"}, {"it": "Più tardi la Chiesa cattolica ha scelto la stessa data, il 15 agosto, per celebrare l’Assunzione di Maria.", "de": "Später wählte die katholische Kirche denselben Tag, den 15. August, für Mariä Himmelfahrt.", "audio": "satz_12.mp3"}, {"it": "In questo giorno, secondo la tradizione, Maria viene accolta in cielo.", "de": "An diesem Tag wird Maria der Überlieferung nach in den Himmel aufgenommen.", "audio": "satz_13.mp3"}, {"it": "Questa sovrapposizione ha reso Ferragosto una festa unica: metà pagana e metà religiosa.", "de": "Diese Verbindung machte Ferragosto zu einem einzigartigen Fest: halb heidnisch und halb religiös.", "audio": "satz_14.mp3"}, {"it": "Oggi in Italia il 15 agosto è un giorno festivo nazionale.", "de": "Heute ist der 15. August in Italien ein landesweiter Feiertag.", "audio": "satz_15.mp3"}, {"it": "Gli uffici sono chiusi, le fabbriche ferme, i negozi abbassano le serrande.", "de": "Die Büros sind geschlossen, die Fabriken stehen still und die Geschäfte schliessen ihre Rollläden.", "audio": "satz_16.mp3"}, {"it": "È il cuore dell’estate, il giorno che divide in due le vacanze di agosto.", "de": "Es ist der Höhepunkt des Sommers, der die Augustferien in zwei Hälften teilt.", "audio": "satz_17.mp3"}, {"it": "Ma non è solo una pausa: per gli italiani Ferragosto è un simbolo.", "de": "Aber es ist mehr als eine Pause: Für die Italiener ist Ferragosto ein Symbol.", "audio": "satz_18.mp3"}, {"it": "Da generazioni si festeggia con la famiglia o con gli amici.", "de": "Seit Generationen feiert man mit der Familie oder mit Freunden.", "audio": "satz_19.mp3"}, {"it": "È una tradizione che tutti, in un modo o nell’altro, rispettano.", "de": "Es ist eine Tradition, die alle auf die eine oder andere Weise achten.", "audio": "satz_20.mp3"}, {"it": "Immagina una mattina del 15 agosto.", "de": "Stell dir einen Morgen am 15. August vor.", "audio": "satz_21.mp3"}, {"it": "Il sole è già alto, le città sono silenziose: niente traffico, tutte le serrande sono abbassate e le piazze sono vuote.", "de": "Die Sonne steht schon hoch, die Städte sind still: kein Verkehr, alle Rollläden sind geschlossen und die Plätze sind leer.", "audio": "satz_22.mp3"}, {"it": "Ma basta uscire dal centro e lo scenario cambia completamente!", "de": "Doch sobald man das Zentrum verlässt, ändert sich die Szenerie vollständig!", "audio": "satz_23.mp3"}, {"it": "Sulle strade che portano al mare, ai laghi o alle montagne c’è traffico, il suono dei clacson è nell’aria e le code sono infinite.", "de": "Auf den Strassen zum Meer, zu den Seen oder in die Berge herrscht Verkehr, Hupen liegt in der Luft und die Staus sind endlos.", "audio": "satz_24.mp3"}, {"it": "Le auto sono cariche di borse frigo e ombrelloni.", "de": "Die Autos sind voller Kühltaschen und Sonnenschirme.", "audio": "satz_25.mp3"}, {"it": "Si parte presto, per cercare un posto dove trascorrere la giornata.", "de": "Man fährt früh los, um einen Platz für den Tag zu finden.", "audio": "satz_26.mp3"}];
const main=document.getElementById('main');let current=null;
items.forEach((item,i)=>{const card=document.createElement('article');const num=document.createElement('b');num.textContent=String(i+1).padStart(2,'0')+'.';const it=document.createElement('div');it.className='it';it.textContent=item.it;const de=document.createElement('div');de.className='de';de.textContent=item.de;const listen=document.createElement('button');listen.textContent='▶ Anhören';const rec=document.createElement('button');rec.textContent='● Aufnehmen';const stop=document.createElement('button');stop.textContent='■ Beenden';stop.disabled=true;const replay=document.createElement('button');replay.textContent='▶ Meine Aufnahme';replay.disabled=true;const del=document.createElement('button');del.textContent='🗑 Löschen';del.disabled=true;const status=document.createElement('div');status.className='status';let blobUrl=null,recorder=null,stream=null,parts=[];const audio=new Audio(item.audio);const mine=new Audio();listen.onclick=()=>{document.querySelectorAll('audio').forEach(a=>a.pause());audio.currentTime=0;audio.play().catch(()=>status.textContent='Audio nicht gefunden: '+item.audio)};card.append(num,it,de,listen,rec,stop,replay,del,status,audio,mine);main.append(card);
rec.onclick=async()=>{try{if(current&&current!==recorder&&current.state==='recording'){status.textContent='Bitte zuerst die andere Aufnahme beenden.';return}stream=await navigator.mediaDevices.getUserMedia({audio:true});parts=[];recorder=new MediaRecorder(stream);current=recorder;recorder.ondataavailable=e=>{if(e.data.size)parts.push(e.data)};recorder.onstop=()=>{if(blobUrl)URL.revokeObjectURL(blobUrl);blobUrl=URL.createObjectURL(new Blob(parts,{type:recorder.mimeType}));mine.src=blobUrl;stream.getTracks().forEach(t=>t.stop());replay.disabled=false;del.disabled=false;status.textContent='Aufnahme bereit.';if(current===recorder)current=null};recorder.start();rec.disabled=true;stop.disabled=false;status.textContent='Aufnahme läuft.'}catch(e){status.textContent='Mikrofon nicht verfügbar. Bitte über GitHub Pages (https) öffnen und Zugriff erlauben.'}};
stop.onclick=()=>{if(recorder&&recorder.state==='recording')recorder.stop();rec.disabled=false;stop.disabled=true};replay.onclick=()=>{mine.currentTime=0;mine.play()};del.onclick=()=>{mine.pause();mine.removeAttribute('src');if(blobUrl)URL.revokeObjectURL(blobUrl);blobUrl=null;replay.disabled=true;del.disabled=true;status.textContent='Aufnahme gelöscht.'};
});</script></body></html>
